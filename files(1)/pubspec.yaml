# NovaGen SafeInk Scanner — dependencies
name: safeink_scanner
description: NovaGen SafeInk Scanner — barcode, color indicator, GPS, and reports.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.10.5+9
  permission_handler: ^11.3.0
  mobile_scanner: ^5.1.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  intl: ^0.19.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
